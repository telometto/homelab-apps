apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vms
  namespace: flux-system
spec:
  interval: 10m
  path: ./vms
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cdi-config
    - name: kubevirt-config
    - name: storage
  timeout: 15m
  wait: false
