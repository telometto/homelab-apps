apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubevirt-config
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubevirt/config
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kubevirt
  timeout: 10m
  wait: true
