apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network-config
  namespace: flux-system
spec:
  interval: 10m
  path: ./network/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: network
  timeout: 5m
  wait: true
