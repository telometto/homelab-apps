apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  configuration:
    developerConfiguration:
      featureGates:
        - HotplugVolumes
        - HostDisk
        - Sidecar
    machineType: q35
  workloadUpdateStrategy:
    workloadUpdateMethods:
      - Evict
