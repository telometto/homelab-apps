apiVersion: v1
kind: Secret
metadata:
  name: actual-cloudinit
  namespace: vms
  labels:
    app.kubernetes.io/name: actual
    app.kubernetes.io/part-of: kubevirt-migration
type: Opaque
stringData:
  userdata: |
    #cloud-config
    ssh_pwauth: false
    disable_root: true
    users:
      - default
      - name: admin
        gecos: Homelab admin
        groups: sudo
        lock_passwd: true
        shell: /bin/bash
        sudo: ALL=(ALL) NOPASSWD:ALL
    write_files:
      - path: /etc/systemd/system/actual-server.service
        owner: root:root
        permissions: '0644'
        content: |
          [Unit]
          Description=Actual Budget server
          Wants=network-online.target
          After=network-online.target

          [Service]
          Restart=always
          RestartSec=5s
          TimeoutStartSec=5min
          ExecStartPre=-/usr/bin/podman pull docker.io/actualbudget/actual-server:latest
          ExecStart=/usr/bin/podman run --rm --name actual-server --cap-drop=all --security-opt=no-new-privileges --publish 0.0.0.0:11051:5006 --volume /srv/actual:/data:Z docker.io/actualbudget/actual-server:latest
          ExecStop=-/usr/bin/podman stop -t 30 actual-server

          [Install]
          WantedBy=multi-user.target
      - path: /etc/systemd/system/actual-bootstrap.service
        owner: root:root
        permissions: '0644'
        content: |
          [Unit]
          Description=Bootstrap Actual Budget guest packages and services
          Wants=network-online.target
          After=network-online.target cloud-final.service
          ConditionPathExists=!/var/lib/actual-bootstrap.done

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/actual-bootstrap
          Restart=on-failure
          RestartSec=30s
          TimeoutStartSec=15min
          StandardOutput=journal+console
          StandardError=journal+console

          [Install]
          WantedBy=multi-user.target
      - path: /usr/local/sbin/actual-bootstrap
        owner: root:root
        permissions: '0755'
        content: |
          #!/bin/sh
          set -eux

          export DEBIAN_FRONTEND=noninteractive

          # Cilium currently gives the virt-launcher pod a 1280-byte MTU. The
          # KubeVirt masquerade bridge and tap inherit that lower MTU, while the
          # Debian guest can come up at 1500. Clamp the guest default interface
          # before apt so larger HTTP responses do not blackhole during bootstrap.
          default_iface="$(ip -4 route show default | awk '{print $5; exit}')"
          if [ -n "$default_iface" ]; then
            ip link set dev "$default_iface" mtu 1280 || true
          fi

          # Avoid relying on kube-dns ClusterIP during early guest bootstrap.
          # With KubeVirt masquerade, Cilium can allow the Service IP yet still
          # fail to return DNS replies to the guest-side NAT flow. Use pinned
          # public resolvers instead; egress policy only permits these IPs on 53.
          rm -f /etc/resolv.conf
          cat > /etc/resolv.conf <<'RESOLV'
          nameserver 1.1.1.1
          nameserver 1.0.0.1
          options timeout:2 attempts:3
          RESOLV

          cat > /etc/apt/apt.conf.d/99homelab-kubevirt <<'APTCONF'
          Acquire::ForceIPv4 "true";
          Acquire::Retries "2";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::http::Pipeline-Depth "0";
          APTCONF

          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          cat > /etc/apt/sources.list <<'SOURCES'
          deb http://deb.debian.org/debian trixie main
          deb http://deb.debian.org/debian trixie-updates main
          deb http://deb.debian.org/debian-security trixie-security main
          SOURCES

          timeout --kill-after=30s 180s apt-get update
          timeout --kill-after=30s 300s apt-get install -y --no-install-recommends ca-certificates nftables podman qemu-guest-agent ufw

          systemctl enable --now qemu-guest-agent
          mkdir -p /srv/actual
          ufw default deny incoming
          ufw default allow outgoing
          ufw allow 11051/tcp
          # Podman DNAT rewrites the published host port 11051 to container
          # port 5006 on podman0. Keep UFW's routed default deny, but allow the
          # Kubernetes pod CIDR admitted by NetworkPolicy to reach Actual.
          if [ -n "$default_iface" ]; then
            ufw route allow \
              in on "$default_iface" \
              out on podman0 \
              proto tcp \
              from 10.42.0.0/16 \
              to 10.88.0.0/16 \
              port 5006
          fi
          ufw --force enable
          systemctl daemon-reload
          systemctl enable --now actual-server.service
          touch /var/lib/actual-bootstrap.done
    runcmd:
      - [systemctl, daemon-reload]
      - [systemctl, enable, actual-bootstrap.service]
      - [systemctl, start, --no-block, actual-bootstrap.service]