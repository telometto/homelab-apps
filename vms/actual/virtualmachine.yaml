apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: actual
  namespace: vms
  labels:
    app.kubernetes.io/name: actual
    app.kubernetes.io/part-of: kubevirt-migration
  annotations:
    homelab.telometto.io/migration-source: nix-config/vms/actual.nix
    homelab.telometto.io/original-microvm-ip: 10.100.0.51
    homelab.telometto.io/original-service-port: "11051"
spec:
  runStrategy: Manual
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actual
        app.kubernetes.io/part-of: kubevirt-migration
        vm.kubevirt.io/name: actual
        kubevirt.io/domain: actual
    spec:
      terminationGracePeriodSeconds: 180
      domain:
        machine:
          type: q35
        cpu:
          cores: 1
        resources:
          requests:
            memory: 1Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: http
                  port: 11051
                  protocol: TCP
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: actual-rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              ssh_pwauth: false
              disable_root: true
              users:
                - default
                - name: admin
                  gecos: Homelab admin
                  groups: sudo
                  lock_passwd: true
                  shell: /bin/bash
                  sudo: ALL=(ALL) NOPASSWD:ALL
              write_files:
                - path: /etc/systemd/system/actual-server.service
                  owner: root:root
                  permissions: '0644'
                  content: |
                    [Unit]
                    Description=Actual Budget server
                    Wants=network-online.target
                    After=network-online.target

                    [Service]
                    Restart=always
                    RestartSec=5s
                    TimeoutStartSec=5min
                    ExecStartPre=-/usr/bin/podman pull docker.io/actualbudget/actual-server:latest
                    ExecStart=/usr/bin/podman run --rm --name actual-server --cap-drop=all --security-opt=no-new-privileges --publish 0.0.0.0:11051:5006 --volume /srv/actual:/data:Z docker.io/actualbudget/actual-server:latest
                    ExecStop=-/usr/bin/podman stop -t 30 actual-server

                    [Install]
                    WantedBy=multi-user.target
                - path: /etc/systemd/system/actual-bootstrap.service
                  owner: root:root
                  permissions: '0644'
                  content: |
                    [Unit]
                    Description=Bootstrap Actual Budget guest packages and services
                    Wants=network-online.target
                    After=network-online.target cloud-final.service
                    ConditionPathExists=!/var/lib/actual-bootstrap.done

                    [Service]
                    Type=oneshot
                    ExecStart=/usr/local/sbin/actual-bootstrap
                    Restart=on-failure
                    RestartSec=30s
                    TimeoutStartSec=15min
                    StandardOutput=journal+console
                    StandardError=journal+console

                    [Install]
                    WantedBy=multi-user.target
                - path: /usr/local/sbin/actual-bootstrap
                  owner: root:root
                  permissions: '0755'
                  content: |
                    #!/bin/sh
                    set -eux

                    export DEBIAN_FRONTEND=noninteractive

                    cat > /etc/apt/apt.conf.d/99homelab-kubevirt <<'APTCONF'
                    Acquire::ForceIPv4 "true";
                    Acquire::Retries "2";
                    Acquire::http::Timeout "20";
                    Acquire::https::Timeout "20";
                    Acquire::http::Pipeline-Depth "0";
                    APTCONF

                    rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
                    cat > /etc/apt/sources.list <<'SOURCES'
                    deb http://deb.debian.org/debian trixie main
                    deb http://deb.debian.org/debian trixie-updates main
                    deb http://deb.debian.org/debian-security trixie-security main
                    SOURCES

                    timeout --kill-after=30s 180s apt-get update
                    timeout --kill-after=30s 300s apt-get install -y --no-install-recommends ca-certificates podman qemu-guest-agent ufw

                    systemctl enable --now qemu-guest-agent
                    mkdir -p /srv/actual
                    ufw default deny incoming
                    ufw default allow outgoing
                    ufw allow 11051/tcp
                    ufw --force enable
                    systemctl daemon-reload
                    systemctl enable --now actual-server.service
                    touch /var/lib/actual-bootstrap.done
              runcmd:
                - [systemctl, daemon-reload]
                - [systemctl, enable, actual-bootstrap.service]
                - [systemctl, start, --no-block, actual-bootstrap.service]
