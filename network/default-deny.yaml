# Default deny all ingress and egress in every workload namespace.
# Explicit per-VM allows live with each KubeVirt VM manifest under vms/.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: vms
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow all traffic within ingress namespace (Traefik <-> cloudflared proxying)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-namespace
  namespace: ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - {}
