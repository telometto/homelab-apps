# Default deny all ingress and egress in every workload namespace.
# Explicit per-service allows are added in Plans 2 and 3.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: vms
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: media
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: apps
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: internal
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# Allow all traffic within ingress namespace (Traefik <-> cloudflared proxying)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-namespace
  namespace: ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - {}
  egress:
    - {}
