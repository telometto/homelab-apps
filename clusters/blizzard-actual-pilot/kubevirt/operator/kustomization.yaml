apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- operator.yaml
patches:
- target:
    kind: Namespace
    name: kubevirt
  patch: |
    apiVersion: v1
    kind: Namespace
    metadata:
      name: kubevirt
      labels:
        pod-security.kubernetes.io/enforce: privileged
