apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: sabnzbd-preview
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  namespace: sabnzbd-preview
  labels:
    app.kubernetes.io/name: sabnzbd-preview
spec:
  runStrategy: Halted
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sabnzbd-preview
    spec:
      nodeSelector:
        kubernetes.io/hostname: blizzard
      terminationGracePeriodSeconds: 120
      domain:
        cpu:
          cores: 1
        memory:
          guest: 1024Mi
        resources:
          requests:
            memory: 1024Mi
            cpu: 250m
          limits:
            memory: 1536Mi
            cpu: '1'
        devices:
          disks:
          - name: root
            disk:
              bus: virtio
            serial: gwaad296e1d425f68b37
          - name: data
            disk:
              bus: virtio
            serial: gwc06cb6fe94ca80c80d
          - name: desired-config
            disk:
              bus: virtio
              readonly: true
            serial: gw544ea133d271fb3d25
          - name: cloudinit
            disk:
              bus: virtio
            serial: gw074f758c9012dc74ee
          interfaces:
          - name: default
            masquerade: {}
            ports:
            - name: primary
              port: 11031
              protocol: TCP
      networks:
      - name: default
        pod: {}
      volumes:
      - name: root
        dataVolume:
          name: sabnzbd-preview-root
      - name: data
        dataVolume:
          name: sabnzbd-preview-data
      - name: desired-config
        configMap:
          name: sabnzbd-preview-desired
          volumeLabel: GROUNDCFG
      - name: cloudinit
        cloudInitNoCloud:
          secretRef:
            name: sabnzbd-preview-cloudinit
      readinessProbe:
        exec:
          command:
          - /usr/bin/false
        initialDelaySeconds: 15
        periodSeconds: 10
