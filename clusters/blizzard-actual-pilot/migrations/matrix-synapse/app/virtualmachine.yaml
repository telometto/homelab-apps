apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: matrix-synapse-preview
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  namespace: matrix-synapse-preview
  labels:
    app.kubernetes.io/name: matrix-synapse-preview
spec:
  runStrategy: Halted
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-synapse-preview
    spec:
      nodeSelector:
        kubernetes.io/hostname: blizzard
      terminationGracePeriodSeconds: 120
      domain:
        cpu:
          cores: 4
        memory:
          guest: 4096Mi
        resources:
          requests:
            memory: 4096Mi
            cpu: 250m
          limits:
            memory: 4608Mi
            cpu: '4'
        devices:
          disks:
          - name: root
            disk:
              bus: virtio
            serial: gwa35b26c28f6a887229
          - name: data
            disk:
              bus: virtio
            serial: gw52440dd79d8a5dd54a
          - name: postgresql
            disk:
              bus: virtio
            serial: gwced66c42b7d7e63804
          - name: mas
            disk:
              bus: virtio
            serial: gw53076557db9359761e
          - name: whatsapp
            disk:
              bus: virtio
            serial: gw770678185d7c8cf87e
          - name: desired-config
            disk:
              bus: virtio
              readonly: true
            serial: gwc9d4505eab29fe3370
          - name: cloudinit
            disk:
              bus: virtio
            serial: gwdddfe95f7bef96f50f
          interfaces:
          - name: default
            masquerade: {}
            ports:
            - name: primary
              port: 11060
              protocol: TCP
      networks:
      - name: default
        pod: {}
      volumes:
      - name: root
        dataVolume:
          name: matrix-synapse-preview-root
      - name: data
        dataVolume:
          name: matrix-synapse-preview-data
      - name: postgresql
        dataVolume:
          name: matrix-synapse-preview-postgresql
      - name: mas
        dataVolume:
          name: matrix-synapse-preview-mas
      - name: whatsapp
        dataVolume:
          name: matrix-synapse-preview-whatsapp
      - name: desired-config
        configMap:
          name: matrix-synapse-preview-desired
          volumeLabel: GROUNDCFG
      - name: cloudinit
        cloudInitNoCloud:
          secretRef:
            name: matrix-synapse-preview-cloudinit
      readinessProbe:
        exec:
          command:
          - /usr/bin/false
        initialDelaySeconds: 15
        periodSeconds: 10
