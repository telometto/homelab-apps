apiVersion: v1
kind: PersistentVolume
metadata:
  name: matrix-synapse-preview-root
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 20480Mi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: matrix-synapse-preview-local
  local:
    path: /flash/enc/vms/kubevirt-pilot/matrix-synapse-preview/root
  claimRef:
    namespace: matrix-synapse-preview
    name: matrix-synapse-preview-root
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - blizzard
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: matrix-synapse-preview-root
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  namespace: matrix-synapse-preview
spec:
  source:
    registry:
      url: docker://quay.io/containerdisks/debian@sha256:90b09aed0bbca79adf4ebb2445b548332dee59a600de20038639747526a44ba7
      pullMethod: node
  pvc:
    storageClassName: matrix-synapse-preview-local
    volumeName: matrix-synapse-preview-root
    volumeMode: Filesystem
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 20480Mi
---
