apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wireguard-preview-ingress
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  namespace: wireguard-preview
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wireguard-preview
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: actual-pilot-probes
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kubevirt
      podSelector:
        matchLabels:
          kubevirt.io: virt-api
    ports:
    - port: 56943
      protocol: UDP
