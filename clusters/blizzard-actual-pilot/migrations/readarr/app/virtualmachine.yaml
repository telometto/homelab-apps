apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: readarr-preview
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  namespace: readarr-preview
  labels:
    app.kubernetes.io/name: readarr-preview
spec:
  runStrategy: Halted
  template:
    metadata:
      labels:
        app.kubernetes.io/name: readarr-preview
    spec:
      nodeSelector:
        kubernetes.io/hostname: blizzard
      terminationGracePeriodSeconds: 120
      domain:
        cpu:
          cores: 1
        memory:
          guest: 1024Mi
        resources:
          requests:
            memory: 1024Mi
            cpu: 250m
          limits:
            memory: 1536Mi
            cpu: '1'
        devices:
          disks:
          - name: root
            disk:
              bus: virtio
            serial: gwf69e2a87a9976658be
          - name: data
            disk:
              bus: virtio
            serial: gwe3c1646218d3928645
          - name: desired-config
            disk:
              bus: virtio
              readonly: true
            serial: gw452f10fe8456a79cac
          - name: cloudinit
            disk:
              bus: virtio
            serial: gw6c5112c57c75eafca9
          interfaces:
          - name: default
            masquerade: {}
            ports:
            - name: primary
              port: 11024
              protocol: TCP
      networks:
      - name: default
        pod: {}
      volumes:
      - name: root
        dataVolume:
          name: readarr-preview-root
      - name: data
        dataVolume:
          name: readarr-preview-data
      - name: desired-config
        configMap:
          name: readarr-preview-desired
          volumeLabel: GROUNDCFG
      - name: cloudinit
        cloudInitNoCloud:
          secretRef:
            name: readarr-preview-cloudinit
      readinessProbe:
        exec:
          command:
          - /usr/bin/false
        initialDelaySeconds: 15
        periodSeconds: 10
