apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: jellyfin-preview
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  namespace: jellyfin-preview
  labels:
    app.kubernetes.io/name: jellyfin-preview
spec:
  runStrategy: Halted
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin-preview
    spec:
      nodeSelector:
        kubernetes.io/hostname: blizzard
      terminationGracePeriodSeconds: 120
      domain:
        cpu:
          cores: 8
        memory:
          guest: 16384Mi
        resources:
          requests:
            memory: 16384Mi
            cpu: 250m
          limits:
            memory: 16896Mi
            cpu: '8'
        devices:
          disks:
          - name: root
            disk:
              bus: virtio
            serial: gw3b69a413a138047f46
          - name: data
            disk:
              bus: virtio
            serial: gw5768bec4494e256c16
          - name: cache
            disk:
              bus: virtio
            serial: gw93a8279b50a714efb3
          - name: desired-config
            disk:
              bus: virtio
              readonly: true
            serial: gwd952c00e09d2cc14c5
          - name: cloudinit
            disk:
              bus: virtio
            serial: gw3e986c673a419f06eb
          interfaces:
          - name: default
            masquerade: {}
            ports:
            - name: primary
              port: 8096
              protocol: TCP
      networks:
      - name: default
        pod: {}
      volumes:
      - name: root
        dataVolume:
          name: jellyfin-preview-root
      - name: data
        dataVolume:
          name: jellyfin-preview-data
      - name: cache
        dataVolume:
          name: jellyfin-preview-cache
      - name: desired-config
        configMap:
          name: jellyfin-preview-desired
          volumeLabel: GROUNDCFG
      - name: cloudinit
        cloudInitNoCloud:
          secretRef:
            name: jellyfin-preview-cloudinit
      readinessProbe:
        exec:
          command:
          - /usr/bin/false
        initialDelaySeconds: 15
        periodSeconds: 10
