apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: radarr-preview
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  namespace: radarr-preview
  labels:
    app.kubernetes.io/name: radarr-preview
spec:
  runStrategy: Halted
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radarr-preview
    spec:
      nodeSelector:
        kubernetes.io/hostname: blizzard
      terminationGracePeriodSeconds: 120
      domain:
        cpu:
          cores: 1
        memory:
          guest: 1024Mi
        resources:
          requests:
            memory: 1024Mi
            cpu: 250m
          limits:
            memory: 1536Mi
            cpu: '1'
        devices:
          disks:
          - name: root
            disk:
              bus: virtio
            serial: gwd8c9e1f62f4a065440
          - name: data
            disk:
              bus: virtio
            serial: gw2fc83bb6d680fad18d
          - name: desired-config
            disk:
              bus: virtio
              readonly: true
            serial: gwff1325dcd46f43858d
          - name: cloudinit
            disk:
              bus: virtio
            serial: gw4930d867d6a7b89685
          interfaces:
          - name: default
            masquerade: {}
            ports:
            - name: primary
              port: 11022
              protocol: TCP
      networks:
      - name: default
        pod: {}
      volumes:
      - name: root
        dataVolume:
          name: radarr-preview-root
      - name: data
        dataVolume:
          name: radarr-preview-data
      - name: desired-config
        configMap:
          name: radarr-preview-desired
          volumeLabel: GROUNDCFG
      - name: cloudinit
        cloudInitNoCloud:
          secretRef:
            name: radarr-preview-cloudinit
      readinessProbe:
        exec:
          command:
          - /usr/bin/false
        initialDelaySeconds: 15
        periodSeconds: 10
