apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bazarr-preview-ingress
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  namespace: bazarr-preview
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bazarr-preview
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: actual-pilot-probes
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kubevirt
      podSelector:
        matchLabels:
          kubevirt.io: virt-api
    ports:
    - port: 11023
      protocol: TCP
