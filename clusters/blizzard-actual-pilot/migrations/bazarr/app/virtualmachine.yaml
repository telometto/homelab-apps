apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: bazarr-preview
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  namespace: bazarr-preview
  labels:
    app.kubernetes.io/name: bazarr-preview
spec:
  runStrategy: Halted
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazarr-preview
    spec:
      nodeSelector:
        kubernetes.io/hostname: blizzard
      terminationGracePeriodSeconds: 120
      domain:
        cpu:
          cores: 1
        memory:
          guest: 1024Mi
        resources:
          requests:
            memory: 1024Mi
            cpu: 250m
          limits:
            memory: 1536Mi
            cpu: '1'
        devices:
          disks:
          - name: root
            disk:
              bus: virtio
            serial: gw67d377418f0a8d34ec
          - name: data
            disk:
              bus: virtio
            serial: gw5feea435b1eb4ceab6
          - name: desired-config
            disk:
              bus: virtio
              readonly: true
            serial: gw11b6c462494543099f
          - name: cloudinit
            disk:
              bus: virtio
            serial: gwa5afad1179be4212d2
          interfaces:
          - name: default
            masquerade: {}
            ports:
            - name: primary
              port: 11023
              protocol: TCP
      networks:
      - name: default
        pod: {}
      volumes:
      - name: root
        dataVolume:
          name: bazarr-preview-root
      - name: data
        dataVolume:
          name: bazarr-preview-data
      - name: desired-config
        configMap:
          name: bazarr-preview-desired
          volumeLabel: GROUNDCFG
      - name: cloudinit
        cloudInitNoCloud:
          secretRef:
            name: bazarr-preview-cloudinit
      readinessProbe:
        exec:
          command:
          - /usr/bin/false
        initialDelaySeconds: 15
        periodSeconds: 10
