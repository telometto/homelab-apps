apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- virtualmachine.yaml
- service.yaml
- networkpolicy.yaml
configMapGenerator:
- name: sonarr-preview-desired
  namespace: sonarr-preview
  files:
  - plan.json
  - runtime.sh
secretGenerator:
- name: sonarr-preview-cloudinit
  namespace: sonarr-preview
  files:
  - userdata=user-data.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
