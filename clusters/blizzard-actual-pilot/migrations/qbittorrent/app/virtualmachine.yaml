apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: qbittorrent-preview
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  namespace: qbittorrent-preview
  labels:
    app.kubernetes.io/name: qbittorrent-preview
spec:
  runStrategy: Halted
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent-preview
    spec:
      nodeSelector:
        kubernetes.io/hostname: blizzard
      terminationGracePeriodSeconds: 120
      domain:
        cpu:
          cores: 1
        memory:
          guest: 2048Mi
        resources:
          requests:
            memory: 2048Mi
            cpu: 250m
          limits:
            memory: 2560Mi
            cpu: '1'
        devices:
          disks:
          - name: root
            disk:
              bus: virtio
            serial: gwea44165d17bef0451c
          - name: data
            disk:
              bus: virtio
            serial: gw60748e5badfb33ac8f
          - name: desired-config
            disk:
              bus: virtio
              readonly: true
            serial: gw15b47ee58d93b94085
          - name: cloudinit
            disk:
              bus: virtio
            serial: gw7563ecb55ce45c78de
          interfaces:
          - name: default
            masquerade: {}
            ports:
            - name: primary
              port: 11030
              protocol: TCP
      networks:
      - name: default
        pod: {}
      volumes:
      - name: root
        dataVolume:
          name: qbittorrent-preview-root
      - name: data
        dataVolume:
          name: qbittorrent-preview-data
      - name: desired-config
        configMap:
          name: qbittorrent-preview-desired
          volumeLabel: GROUNDCFG
      - name: cloudinit
        cloudInitNoCloud:
          secretRef:
            name: qbittorrent-preview-cloudinit
      readinessProbe:
        exec:
          command:
          - /usr/bin/false
        initialDelaySeconds: 15
        periodSeconds: 10
