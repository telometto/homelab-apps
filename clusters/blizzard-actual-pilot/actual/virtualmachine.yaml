apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: actual-pilot
  namespace: actual-pilot
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/name: actual-pilot
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actual-pilot
    spec:
      nodeSelector:
        kubernetes.io/hostname: blizzard
      terminationGracePeriodSeconds: 120
      domain:
        cpu:
          cores: 1
        memory:
          guest: 1Gi
        resources:
          requests:
            memory: 1Gi
            cpu: 250m
          limits:
            memory: 1536Mi
            cpu: '1'
        devices:
          disks:
          - name: root
            disk:
              bus: virtio
            serial: actual-pilot-root
          - name: data
            disk:
              bus: virtio
            serial: actual-pilot-data
          - name: cloudinit
            disk:
              bus: virtio
          interfaces:
          - name: default
            masquerade: {}
            ports:
            - name: http
              port: 5006
              protocol: TCP
      networks:
      - name: default
        pod: {}
      volumes:
      - name: root
        dataVolume:
          name: actual-pilot-root
      - name: data
        dataVolume:
          name: actual-pilot-data
      - name: cloudinit
        cloudInitNoCloud:
          secretRef:
            name: actual-pilot-cloudinit
      readinessProbe:
        httpGet:
          port: 5006
          path: /
        initialDelaySeconds: 15
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 90
