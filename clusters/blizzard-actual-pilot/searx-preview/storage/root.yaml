apiVersion: v1
kind: PersistentVolume
metadata:
  name: searx-preview-root
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: searx-preview-local
  local:
    path: /flash/enc/vms/kubevirt-pilot/searx-preview/root
  claimRef:
    namespace: searx-preview
    name: searx-preview-root
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - blizzard
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: searx-preview-root
  namespace: searx-preview
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  source:
    registry:
      url: docker://quay.io/containerdisks/debian@sha256:90b09aed0bbca79adf4ebb2445b548332dee59a600de20038639747526a44ba7
      pullMethod: node
  pvc:
    storageClassName: searx-preview-local
    volumeName: searx-preview-root
    volumeMode: Filesystem
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
