    failed: has(status.phase) && status.phase == 'Failed'
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pilot-wireguard-app
  namespace: flux-system
spec:
  interval: 2m
  path: ./clusters/blizzard-actual-pilot/migrations/wireguard/app
  prune: false
  suspend: true
  sourceRef:
    kind: GitRepository
    name: actual-pilot
  wait: true
  timeout: 20m
  dependsOn:
  - name: pilot-kubevirt
  - name: pilot-wireguard-storage
  healthCheckExprs:
  - apiVersion: kubevirt.io/v1
    kind: VirtualMachine
    current: ((spec.runStrategy == 'Halted' && has(status.printableStatus) && status.printableStatus
      == 'Stopped') || (spec.runStrategy == 'Always' && has(status.ready) && status.ready))
    failed: has(status.conditions) && status.conditions.exists(c, c.type == 'Failure'
      && c.status == 'True')
