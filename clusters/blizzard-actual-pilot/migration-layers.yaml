apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pilot-bazarr-storage
  namespace: flux-system
spec:
  interval: 2m
  path: ./clusters/blizzard-actual-pilot/migrations/bazarr/storage
  prune: false
  suspend: true
  sourceRef:
    kind: GitRepository
    name: actual-pilot
  wait: true
  timeout: 20m
  dependsOn:
  - name: pilot-cdi
  healthCheckExprs:
  - apiVersion: cdi.kubevirt.io/v1beta1
    kind: DataVolume
    current: has(status.phase) && status.phase == 'Succeeded'
    failed: has(status.phase) && status.phase == 'Failed'
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pilot-bazarr-app
  namespace: flux-system
spec:
  interval: 2m
  path: ./clusters/blizzard-actual-pilot/migrations/bazarr/app
  prune: false
  suspend: true
  sourceRef:
    kind: GitRepository
    name: actual-pilot
  wait: true
  timeout: 20m
  dependsOn:
  - name: pilot-kubevirt
  - name: pilot-bazarr-storage
  healthCheckExprs:
  - apiVersion: kubevirt.io/v1
    kind: VirtualMachine
    current: ((spec.runStrategy == 'Halted' && has(status.printableStatus) && status.printableStatus
      == 'Stopped') || (spec.runStrategy == 'Always' && has(status.ready) && status.ready))
    failed: has(status.conditions) && status.conditions.exists(c, c.type == 'Failure'
      && c.status == 'True')
---
