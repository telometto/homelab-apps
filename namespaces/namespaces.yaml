apiVersion: v1
kind: Namespace
metadata:
  name: vms
  labels:
    # KubeVirt virt-launcher pods need privileged pod security to access KVM.
    # Workload isolation is provided by the VM boundary plus NetworkPolicies.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
